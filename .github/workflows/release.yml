name: Release

# Release is driven exclusively by tags. Pushing a tag such as 0.7.3 or
# 0.7.3-beta publishes the image and creates the matching GitHub Release.
# workflow_dispatch exists only to re-run a release for an existing tag.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. 0.7.3-beta'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tags: ${{ steps.meta.outputs.tags }}
      sha: ${{ steps.meta.outputs.sha }}
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate tag and version
        id: meta
        env:
          # Any value here means the repository opted into Docker Hub.
          DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a release tag (expected X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi

          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$FILE_VERSION" != "$TAG" ]]; then
            echo "::error::VERSION file contains '$FILE_VERSION' but the tag is '$TAG'. Bump VERSION before tagging."
            exit 1
          fi

          # GHCR works with the built-in token, so a release never blocks on
          # external credentials. Docker Hub is used only when configured.
          if [[ -n "$DOCKERHUB_USER" ]]; then
            REGISTRY="docker.io"
            IMAGE="${DOCKERHUB_USER}/evolution-go"
          else
            REGISTRY="ghcr.io"
            IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/evolution-go"
          fi

          TAGS="${IMAGE}:${TAG}"
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi

          {
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "registry=$REGISTRY"
            echo "sha=$(git rev-parse HEAD)"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Release tag : $TAG"
          echo "Prerelease  : $PRERELEASE"
          echo "Registry    : $REGISTRY"
          echo "Image       : $IMAGE"

  build:
    name: Build and push image
    needs: validate
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_PASS: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_PASS }}

      - name: Login to GHCR
        if: env.DOCKERHUB_USER == ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # Both platforms are mandatory: a single-arch manifest fails on
          # arm64 nodes with "no match for platform in manifest".
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.validate.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.validate.outputs.tag }}

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Tag | \`${{ needs.validate.outputs.tag }}\` |"
            echo "| Registry | \`${{ needs.validate.outputs.registry }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          # Match the heading exactly, not as a prefix: extracting "## v0.7.3"
          # must not pick up the "## v0.7.3-beta" section.
          awk -v heading="## v${TAG}" '
            !found && $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            {
              echo "## v${TAG}"
              echo ""
              echo "**Image:** \`${{ needs.validate.outputs.registry }}\`"
              echo ""
              echo "No CHANGELOG section found for this tag."
            } > "$RUNNER_TEMP/notes.md"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              -f tag_name="$TAG" \
              -f name="v${TAG}" \
              -F body=@"$RUNNER_TEMP/notes.md" \
              -F prerelease="$PRERELEASE" \
              >/dev/null
            exit 0
          fi

          FLAGS=(--title "v${TAG}" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ "$PRERELEASE" == "true" ]]; then
            # GitHub never marks a prerelease as "latest", so no extra flag is
            # needed here (and --latest requires a newer gh than runners ship).
            FLAGS+=(--prerelease)
          fi

          gh release create "$TAG" "${FLAGS[@]}"
